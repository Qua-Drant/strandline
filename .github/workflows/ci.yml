name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a fresh run (instead of "re-run failed jobs", which uploads a second github-pages artifact and makes deploy-pages refuse)
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Frontend lint, tests, typecheck and build
        run: |
          npm run lint
          npm test
          npm run build
      - name: Smoke test of the production build (headless Chrome)
        run: npm run smoke
        env:
          SMOKE_OUT: smoke
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke
          if-no-files-found: ignore
      - name: Backend clippy
        run: npm run lint:backend
      - name: Backend tests (sandbox only)
        run: npm run test:backend

  pages:
    # the browser demo (mock data) on GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
