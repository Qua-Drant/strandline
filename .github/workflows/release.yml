name: Release

# Push a tag like v0.1.0 to build and publish a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match tauri.conf.json version $v" }

      - name: Full checks
        run: |
          npm run lint
          npm test
          npm run build
          npm run lint:backend
          npm run test:backend

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/Strandline_${v}_x64-setup.exe"
          Copy-Item src-tauri/target/release/strandline.exe "out/Strandline_${v}_x64-portable.exe"
          Push-Location out
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          $notes = @"
          Strandline $v

          - **Strandline_${v}_x64-setup.exe** — installer (per-user, no admin needed)
          - **Strandline_${v}_x64-portable.exe** — portable, needs the WebView2 runtime (built into Windows 11)
          - **SHA256SUMS.txt** — checksums

          First launch starts in read-only mode. See SECURITY.md for the safety model.
          "@
          gh release create $v out/*.exe out/SHA256SUMS.txt --draft --title "Strandline $v" --notes $notes
